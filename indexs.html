<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Visual Novel Engine</title>

  <style>
    :root{
      --max-width:900px;
      --ui-pad:20px;
      --textbox-bg: rgba(0,0,0,0.65);
      --textbox-color:#fff;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    html,body{
      margin:0;
      height:100%;
      background:#000;
      font-family:var(--font);
      color:var(--textbox-color);
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
      box-sizing:border-box;
    }

    #game{
      width:100%;
      max-width:var(--max-width);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    #stage{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      background:#111;
      overflow:hidden;
      border-radius:12px;
    }

    #background{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .sprite{
      position:absolute;
      bottom:0;
      max-height:100%;
      transition:opacity .3s;
      pointer-events:none;
    }

    .left{ left:2%; }
    .right{ right:2%; }
    .hidden{ opacity:0; }

    #textbox{
      background:var(--textbox-bg);
      padding:var(--ui-pad);
      border-radius:12px;
      font-size:20px;
      min-height:80px;
      cursor:pointer;
    }

    .caret{
      display:inline-block;
      width:10px;
      height:1.1em;
      background:#fff;
      margin-left:6px;
      animation:blink 1s steps(1) infinite;
    }

    @keyframes blink{50%{opacity:0}}

    #choices{
      display:none;
      flex-direction:column;
      gap:8px;
    }

    .choice{
      background:#fff;
      color:#000;
      padding:12px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div id="game">

    <div id="stage">
      <img id="background" src="" />
      <img id="spriteLeft" class="sprite left hidden" src="" />
      <img id="spriteRight" class="sprite right hidden" src="" />
    </div>

    <div id="textbox"></div>
    <div id="choices"></div>

  </div>
</div>

<script>
/* ===== ELEMENTS ===== */
const textbox = document.getElementById('textbox');
const choicesBox = document.getElementById('choices');
const bg = document.getElementById('background');
const leftSprite = document.getElementById('spriteLeft');
const rightSprite = document.getElementById('spriteRight');

/* ===== STATE ===== */
let typing = false;
let readyForNext = false;
let currentText = "";
let timer = null;
const speed = 28;

/* ===== ENGINE ===== */
function setBackground(src){ bg.src = src || ""; }

function setLeftSprite(src){
  if(src){ leftSprite.src = src; leftSprite.classList.remove('hidden'); }
  else leftSprite.classList.add('hidden');
}

function setRightSprite(src){
  if(src){ rightSprite.src = src; rightSprite.classList.remove('hidden'); }
  else rightSprite.classList.add('hidden');
}

function clearChoices(){
  choicesBox.innerHTML="";
  choicesBox.style.display="none";
}

function showChoices(list){
  clearChoices();
  choicesBox.style.display="flex";
  list.forEach(c=>{
    const btn=document.createElement('div');
    btn.className='choice';
    btn.textContent=c.text;
    btn.onclick=c.onSelect;
    choicesBox.appendChild(btn);
  });
}

function typeText(text){
  typing = true;
  readyForNext = false;
  currentText = text;
  textbox.innerHTML = "";

  const span = document.createElement('span');
  const caret = document.createElement('span');
  caret.className = "caret";
  textbox.append(span, caret);

  let i = 0;
  clearInterval(timer);
  timer = setInterval(()=>{
    span.textContent += text[i] || "";
    i++;
    if(i >= text.length){
      clearInterval(timer);
      typing = false;
      span.textContent = text;
      readyForNext = true;
    }
  }, speed);
}

function skipTyping(){
  if(!typing) return;
  clearInterval(timer);
  typing = false;
  textbox.innerHTML = currentText + '<span class="caret"></span>';
  readyForNext = true;
}

/* ===== TAP LOGIC ===== */
textbox.onclick = () => {
  if(typing){
    skipTyping();
    return;
  }
  if(readyForNext && choicesBox.style.display !== "flex"){
    readyForNext = false;
    nextScene();
  }
};

/* ===== STORY ===== */
let scene = 0;

function nextScene(){
  scene++;
  runScene();
}

function runScene(){
  clearChoices();

  switch(scene){
    case 0:
      setBackground("");
      setLeftSprite(null);
      setRightSprite(null);
      typeText("The beginning of my writings");
      break;

    case 1:
      typeText("I buried each of them");
      break;

    case 2:
      typeText("Those rottens who deserved it");
      break;

    case 3:
      typeText("They all had the same rotten flesh inside themselves");
      break;

    case 4:
      typeText("...");
      break;

    case 5:
      typeText("14 February 2025");
      break;

    case 6:
      typeText("You heard a notification from your socials. She had accepted your message request.");
      break;

    case 7:
      typeText("HER: WHOS THIS");
      break;

    case 8:
      typeText("YOU: I'm your secret admirer");
      break;

    case 9:
      typeText("HER: HAA WHAT");
      break;

    case 10:
      typeText("HER: What a great starting text to a conversation");
      break;

    case 11:
      typeText("YOU: Mmmhm yeah..");
      break;

    case 12:
      typeText("HER: BRO WHO ARE YOUUUU REALLY");
      break;

    case 13:
      showChoices([
        { text:"Change Topic", onSelect:()=>{scene=14; runScene();} },
        { text:"Introduce Yourself", onSelect:()=>{scene=10; runScene();} }
      ]);
      typeText("...");
      break;

    case 14:
      typeText("YOU: Oh well..");
      break;

    case 15:
      showChoices([
        { text: "Ask about city", onSelect: () => { scene = 16; runScene(); } },
        { text: "Say nothing", onSelect: () => { scene = 16; runScene(); } }
      ]);
      typeText("YOU: Which part of city are you in?");
      break;

    case 16:
      typeText("HER: I'm downtown, near the old plaza.");
      break;

    case 17:
      typeText("YOU: You know… I only talk to people who matter to me.");
      break;

    case 18:
      typeText("HER: That's… kind of weird, right?");
      break;

    case 19:
      typeText("YOU: You left me once… you know that, right?");
      break;

    case 20:
      typeText("HER: Wait… what?");
      break;

    case 21:
      typeText("YOU: Yeah… everyone who leaves me… are rottens. You killed me the moment you walked away.");
      break;

    case 22:
      typeText("HER: You said you killed someone…");
      break;

    case 23:
      typeText("YOU: Yeah…");
      break;

    case 24:
      typeText("HER: Then why are you still not in prison?");
      break;

    case 25:
      typeText("YOU: I'm just careful, I guess…");
      break;

    case 26:
      typeText("HER: …I think I need to leave now.");
      break;

    case 27:
      typeText("YOU: You can go… but remember, rottens always leave a mark.");
      break;

    default:
      typeText("THE END");
      break;
  }
}

/* START */
runScene();
</script>
</body>
</html>
